<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#667eea">
<title>لوحة التحكم - Sim Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}

/* الهيدر */
.header{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.user-info{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,255,255,0.3);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:700;font-size:15px}
.user-email{font-size:12px;color:rgba(255,255,255,0.7)}
.logout-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:0.3s}
.logout-btn:hover{background:rgba(255,255,255,0.25)}

/* بطاقات الإحصائيات */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:18px;text-align:center;animation:rise .7s ease both}
.stat-icon{font-size:28px;margin-bottom:8px}
.stat-value{font-size:24px;font-weight:800;margin-bottom:4px}
.stat-label{font-size:12px;color:rgba(255,255,255,0.7)}
.stat-card.balance{background:linear-gradient(135deg,rgba(16,185,129,0.3),rgba(5,150,105,0.2));border-color:rgba(16,185,129,0.4)}
.stat-card.balance .stat-value{color:#51cf66}

/* التبويبات */
.tabs{display:flex;background:rgba(0,0,0,0.25);border-radius:14px;padding:4px;margin-bottom:20px;overflow-x:auto}
.tab{flex:1;padding:12px;text-align:center;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:0.3s;color:rgba(255,255,255,0.65);white-space:nowrap;min-width:100px}
.tab.active{background:rgba(255,255,255,0.22);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.tab-content{display:none;animation:rise .5s ease both}
.tab-content.active{display:block}

/* البطاقات العامة */
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:22px;margin-bottom:16px}
.card-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* قائمة الأرقام */
.number-item{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:0.3s}
.number-item:hover{background:rgba(255,255,255,0.12);transform:translateX(-3px)}
.number-info{flex:1}
.number-value{font-size:16px;font-weight:700;font-family:monospace;direction:ltr;text-align:right}
.number-service{font-size:12px;color:rgba(255,255,255,0.7);margin-top:4px}
.number-code{background:rgba(102,126,234,0.3);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:0.3s;margin:0 8px}
.number-code:hover{background:rgba(102,126,234,0.5)}
.copy-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px;transition:0.3s}
.copy-btn:hover{background:rgba(255,255,255,0.25)}

/* نموذج الإيداع */
.deposit-form{display:flex;flex-direction:column;gap:12px}
.input-group{display:flex;flex-direction:column;gap:6px}
.input-group label{font-size:13px;color:rgba(255,255,255,0.9);font-weight:600}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:14px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:#fff;font-size:15px;outline:none;transition:0.3s}
.input-group input::placeholder,.input-group textarea::placeholder{color:rgba(255,255,255,0.5)}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.22)}
.input-group select option{background:#764ba2;color:#fff}
.amount-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.amount-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:0.3s}
.amount-btn:hover,.amount-btn.selected{background:rgba(102,126,234,0.3);border-color:#667eea}
.btn-primary{width:100%;padding:15px;background:rgba(255,255,255,0.95);color:#764ba2;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:0.3s;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.btn-primary:hover{background:#fff;transform:translateY(-2px)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}

/* الرسائل */
.message-item{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px;margin-bottom:10px;transition:0.3s;cursor:pointer}
.message-item:hover{background:rgba(255,255,255,0.12)}
.message-item.unread{border-right:3px solid #667eea}
.message-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.message-title{font-weight:700;font-size:14px}
.message-time{font-size:11px;color:rgba(255,255,255,0.6)}
.message-body{font-size:13px;color:rgba(255,255,255,0.8);line-height:1.5}
.message-badge{background:#667eea;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}

/* حالة الاتصال */
.connection-status{position:fixed;top:20px;left:20px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);padding:8px 14px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:6px;z-index:100;transition:0.3s}
.status-dot{width:8px;height:8px;border-radius:50%;background:#51cf66}
.status-dot.offline{background:#ff6b6b}

/* رسالة فارغة */
.empty-state{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.6)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state .text{font-size:14px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);padding:12px 24px;border-radius:12px;font-size:14px;z-index:1000;opacity:0;transition:0.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
.toast.success{border-right:3px solid #51cf66}
.toast.error{border-right:3px solid #ff6b6b}
</style>
</head>
<body>

<div class="connection-status" id="connectionStatus">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">متصل</span>
</div>

<div class="container">
  <!-- الهيدر -->
  <div class="header">
    <div class="user-info">
      <div class="avatar" id="userAvatar">👤</div>
      <div>
        <div class="user-name" id="userName">مستخدم</div>
        <div class="user-email" id="userEmail"></div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">خروج</button>
  </div>

  <!-- الإحصائيات -->
  <div class="stats-grid">
    <div class="stat-card balance">
      <div class="stat-icon">💰</div>
      <div class="stat-value" id="balanceValue">$0.00</div>
      <div class="stat-label">الرصيد الحالي</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔢</div>
      <div class="stat-value" id="numbersCount">0</div>
      <div class="stat-label">أرقام نشطة</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📬</div>
      <div class="stat-value" id="messagesCount">0</div>
      <div class="stat-label">رسائل جديدة</div>
    </div>
  </div>

  <!-- التبويبات -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('numbers')">🔢 أرقامي</div>
    <div class="tab" onclick="switchTab('deposit')">💳 إيداع</div>
    <div class="tab" onclick="switchTab('messages')">📬 الرسائل</div>
    <div class="tab" onclick="switchTab('settings')">⚙️ الإعدادات</div>
  </div>

  <!-- تبويب الأرقام -->
  <div class="tab-content active" id="tab-numbers">
    <div class="card">
      <div class="card-title">🔢 أرقامي النشطة</div>
      <div id="numbersList">
        <div class="empty-state">
          <div class="icon">📭</div>
          <div class="text">لا توجد أرقام نشطة حالياً</div>
        </div>
      </div>
      <button class="btn-primary" onclick="requestNumber()" style="margin-top:16px">+ طلب رقم جديد</button>
    </div>
  </div>

  <!-- تبويب الإيداع -->
  <div class="tab-content" id="tab-deposit">
    <div class="card">
      <div class="card-title">💳 إيداع رصيد</div>
      <div class="deposit-form">
        <div>
          <label style="font-size:13px;color:rgba(255,255,255,0.9);font-weight:600;display:block;margin-bottom:8px">اختر المبلغ:</label>
          <div class="amount-options">
            <div class="amount-btn" onclick="selectAmount(5)">$5</div>
            <div class="amount-btn" onclick="selectAmount(10)">$10</div>
            <div class="amount-btn" onclick="selectAmount(20)">$20</div>
            <div class="amount-btn" onclick="selectAmount(50)">$50</div>
            <div class="amount-btn" onclick="selectAmount(100)">$100</div>
            <div class="amount-btn" onclick="selectAmount(0)">مبلغ آخر</div>
          </div>
        </div>
        <div class="input-group" id="customAmountGroup" style="display:none">
          <label>المبلغ المخصص ($)</label>
          <input type="number" id="customAmount" placeholder="10" min="1" max="1000">
        </div>
        <div class="input-group">
          <label>طريقة الدفع</label>
          <select id="paymentMethod">
            <option value="syriatel">سيريتيل كاش</option>
            <option value="mtncash">MTN كاش</option>
            <option value="whatsapp">تحويل عبر واتساب</option>
          </select>
        </div>
        <div class="input-group">
          <label>رقم العملية (اختياري)</label>
          <input type="text" id="transactionId" placeholder="أدخل رقم العملية إن وجد">
        </div>
        <button class="btn-primary" onclick="submitDeposit()">تأكيد الإيداع</button>
      </div>
    </div>
  </div>

  <!-- تبويب الرسائل -->
  <div class="tab-content" id="tab-messages">
    <div class="card">
      <div class="card-title">📬 صندوق الرسائل</div>
      <div id="messagesList">
        <div class="empty-state">
          <div class="icon">📭</div>
          <div class="text">لا توجد رسائل</div>
        </div>
      </div>
    </div>
  </div>

  <!-- تبويب الإعدادات -->
  <div class="tab-content" id="tab-settings">
    <div class="card">
      <div class="card-title">⚙️ إعدادات الحساب</div>
      <div class="deposit-form">
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="settingsEmail" readonly>
        </div>
        <div class="input-group">
          <label>تاريخ الانضمام</label>
          <input type="text" id="joinDate" readonly>
        </div>
        <div class="input-group">
          <label>آخر دخول</label>
          <input type="text" id="lastLogin" readonly>
        </div>
        <button class="btn-primary" onclick="clearData()" style="background:rgba(255,107,107,0.3);color:#fff">🗑️ مسح جميع البيانات</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentUser = null;
let selectedAmount = 0;
let userData = { balance: 0, numbers: [], messages: [] };

// التحقق من تسجيل الدخول
window.addEventListener('load', () => {
  const savedUser = localStorage.getItem('simUser');
  if (!savedUser) {
    window.location.href = '/login.html';
    return;
  }
  
  try {
    currentUser = JSON.parse(savedUser);
    loadUserData();
    renderUI();
  } catch(e) {
    window.location.href = '/login.html';
  }
  
  // مراقبة حالة الاتصال
  updateConnectionStatus();
  window.addEventListener('online', updateConnectionStatus);
  window.addEventListener('offline', updateConnectionStatus);
});

function loadUserData() {
  const saved = localStorage.getItem('simData_' + currentUser.email);
  if (saved) {
    userData = JSON.parse(saved);
  } else {
    // بيانات تجريبية للعرض
    userData = {
      balance: 25.50,
      numbers: [
        { id: 1, number: '+1 (415) 555-0123', service: 'WhatsApp', code: '839201', expires: '2026-11-20' },
        { id: 2, number: '+44 7700 900123', service: 'Telegram', code: '472819', expires: '2026-11-19' }
      ],
      messages: [
        { id: 1, title: 'مرحباً بك في Sim Store', body: 'تم إنشاء حسابك بنجاح. رصيدك الأولي $25.50 كهدية ترحيبية!', time: '2026-11-17 10:30', unread: true },
        { id: 2, title: 'رقم جديد جاهز', body: 'تم تفعيل رقم WhatsApp: +1 (415) 555-0123', time: '2026-11-17 11:15', unread: true }
      ]
    };
    saveUserData();
  }
}

function saveUserData() {
  localStorage.setItem('simData_' + currentUser.email, JSON.stringify(userData));
}

function renderUI() {
  // معلومات المستخدم
  document.getElementById('userName').textContent = currentUser.name || 'مستخدم Sim Store';
  document.getElementById('userEmail').textContent = currentUser.email;
  if (currentUser.picture && currentUser.picture.startsWith('http')) {
    document.getElementById('userAvatar').innerHTML = `<img src="${currentUser.picture}" alt="avatar">`;
  }
  
  // الإحصائيات
  document.getElementById('balanceValue').textContent = '$' + userData.balance.toFixed(2);
  document.getElementById('numbersCount').textContent = userData.numbers.length;
  const unreadCount = userData.messages.filter(m => m.unread).length;
  document.getElementById('messagesCount').textContent = unreadCount;
  
  // الأرقام
  renderNumbers();
  renderMessages();
  
  // الإعدادات
  document.getElementById('settingsEmail').value = currentUser.email;
  document.getElementById('joinDate').value = currentUser.loginTime ? new Date(currentUser.loginTime).toLocaleDateString('ar-SY') : 'اليوم';
  document.getElementById('lastLogin').value = currentUser.lastLogin || 'الآن';
}

function renderNumbers() {
  const list = document.getElementById('numbersList');
  if (userData.numbers.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div class="text">لا توجد أرقام نشطة حالياً</div></div>';
    return;
  }
  
  list.innerHTML = userData.numbers.map(n => `
    <div class="number-item">
      <div class="number-info">
        <div class="number-value">${n.number}</div>
        <div class="number-service">${n.service} • ينتهي: ${n.expires}</div>
      </div>
      <div class="number-code" onclick="copyCode('${n.code}')">${n.code}</div>
      <button class="copy-btn" onclick="copyNumber('${n.number}')">نسخ</button>
    </div>
  `).join('');
}

function renderMessages() {
  const list = document.getElementById('messagesList');
  if (userData.messages.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div class="text">لا توجد رسائل</div></div>';
    return;
  }
  
  list.innerHTML = userData.messages.map(m => `
    <div class="message-item ${m.unread ? 'unread' : ''}" onclick="markAsRead(${m.id})">
      <div class="message-header">
        <div class="message-title">${m.title}</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${m.unread ? '<span class="message-badge">جديد</span>' : ''}
          <div class="message-time">${m.time}</div>
        </div>
      </div>
      <div class="message-body">${m.body}</div>
    </div>
  `).join('');
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
}

function selectAmount(amount) {
  selectedAmount = amount;
  document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
  
  if (amount === 0) {
    document.getElementById('customAmountGroup').style.display = 'flex';
  } else {
    document.getElementById('customAmountGroup').style.display = 'none';
  }
}

function submitDeposit() {
  let amount = selectedAmount;
  if (amount === 0) {
    amount = parseFloat(document.getElementById('customAmount').value);
  }
  
  if (!amount || amount < 1) {
    showToast('⚠️ يرجى اختيار مبلغ صحيح', 'error');
    return;
  }
  
  if (amount > 1000) {
    showToast('⚠️ الحد الأقصى للإيداع $1000', 'error');
    return;
  }
  
  const method = document.getElementById('paymentMethod').value;
  const transactionId = document.getElementById('transactionId').value;
  
  // حفظ طلب الإيداع
  const deposit = {
    amount, method, transactionId,
    status: 'pending',
    time: new Date().toLocaleString('ar-SY')
  };
  
  // في الوضع الحقيقي، نرسل الطلب للسيرفر
  // هنا نحفظه محلياً ونضيف رسالة
  userData.messages.unshift({
    id: Date.now(),
    title: 'طلب إيداع جديد',
    body: `تم استلام طلب إيداع بقيمة $${amount} عبر ${method}. سيتم التأكيد خلال دقائق.`,
    time: deposit.time,
    unread: true
  });
  
  saveUserData();
  renderUI();
  showToast('✅ تم إرسال طلب الإيداع بنجاح!', 'success');
  
  // إعادة تعيين النموذج
  selectedAmount = 0;
  document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('customAmount').value = '';
  document.getElementById('transactionId').value = '';
}

function requestNumber() {
  showToast('🔄 جاري طلب رقم جديد... سيتم إشعارك عند التوفر', 'success');
  
  // محاكاة: إضافة رقم جديد بعد 3 ثوانٍ
  setTimeout(() => {
    const services = ['WhatsApp', 'Telegram', 'Instagram', 'Facebook'];
    const countries = ['+1', '+44', '+49', '+33'];
    const service = services[Math.floor(Math.random() * services.length)];
    const country = countries[Math.floor(Math.random() * countries.length)];
    const number = `${country} ${Math.floor(Math.random()*9000+1000)} ${Math.floor(Math.random()*9000+1000)}`;
    const code = Math.floor(Math.random()*900000+100000).toString();
    const expires = new Date(Date.now() + 3*24*60*60*1000).toISOString().split('T')[0];
    
    userData.numbers.push({
      id: Date.now(), number, service, code, expires
    });
    
    userData.messages.unshift({
      id: Date.now(),
      title: 'رقم جديد جاهز! 🎉',
      body: `تم تفعيل رقم ${service}: ${number}`,
      time: new Date().toLocaleString('ar-SY'),
      unread: true
    });
    
    saveUserData();
    renderUI();
    showToast('🎉 تم إضافة رقم جديد!', 'success');
  }, 3000);
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => {
    showToast('✅ تم نسخ الكود: ' + code, 'success');
  });
}

function copyNumber(number) {
  navigator.clipboard.writeText(number).then(() => {
    showToast('✅ تم نسخ الرقم', 'success');
  });
}

function markAsRead(id) {
  const msg = userData.messages.find(m => m.id === id);
  if (msg) {
    msg.unread = false;
    saveUserData();
    renderUI();
  }
}

function updateConnectionStatus() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (navigator.onLine) {
    dot.classList.remove('offline');
    text.textContent = 'متصل';
  } else {
    dot.classList.add('offline');
    text.textContent = 'غير متصل - الطلبات ستُرسل لاحقاً';
  }
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show ' + type;
  setTimeout(() => { toast.className = 'toast'; }, 3000);
}

function logout() {
  if (confirm('هل تريد تسجيل الخروج؟')) {
    localStorage.removeItem('simUser');
    window.location.href = '/login.html';
  }
}

function clearData() {
  if (confirm('⚠️ هل أنت متأكد؟ سيتم مسح جميع بياناتك!')) {
    localStorage.removeItem('simData_' + currentUser.email);
    userData = { balance: 0, numbers: [], messages: [] };
    saveUserData();
    renderUI();
    showToast('🗑️ تم مسح البيانات', 'success');
  }
}
</script>
