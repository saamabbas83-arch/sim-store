<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sim Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0a0a1a;color:#fff;overflow-x:hidden;min-height:100vh}
canvas#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bg-glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(150px);opacity:0.4;z-index:1;pointer-events:none;animation:float 12s ease-in-out infinite}
.bg-glow.a{background:#667eea;top:-200px;right:-200px}
.bg-glow.b{background:#764ba2;bottom:-200px;left:-200px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,40px)}}
.splash{position:fixed;inset:0;background:#0a0a1a;z-index:999;display:flex;justify-content:center;align-items:center;transition:opacity .8s,visibility .8s}
.splash.hide{opacity:0;visibility:hidden}
.loader{width:70px;height:70px;border:3px solid rgba(102,126,234,.2);border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:40px 20px}
.brand{text-align:center;margin-bottom:30px;animation:rise .9s ease both}
.logo{font-size:56px;margin-bottom:10px;display:inline-block;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(102,126,234,.5))}50%{transform:scale(1.08);filter:drop-shadow(0 0 25px rgba(118,75,162,.8))}}
h1{font-size:34px;font-weight:800;background:linear-gradient(90deg,#667eea,#a78bfa,#f472b6,#667eea);background-size:300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300%}}
.tag{color:rgba(255,255,255,.65);font-size:15px;margin-top:8px}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:rise 1.1s .2s ease both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.stats{display:flex;justify-content:space-around;margin-bottom:28px}
.stat{text-align:center}
.stat .num{font-size:26px;font-weight:800;color:#a78bfa}
.stat .lbl{font-size:12px;color:rgba(255,255,255,.55);margin-top:4px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.feat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;text-align:center;transition:.3s;cursor:pointer}
.feat:hover{transform:translateY(-5px);background:rgba(102,126,234,.15);border-color:rgba(102,126,234,.4)}
.feat .ico{font-size:26px;margin-bottom:6px}
.feat .txt{font-size:13px;color:rgba(255,255,255,.8)}
.btn{display:block;width:100%;padding:17px;border:none;border-radius:50px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:17px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;transition:.3s;box-shadow:0 10px 30px rgba(102,126,234,.4);text-decoration:none;text-align:center}
.btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(102,126,234,.6)}
.btn:active{transform:scale(.97)}
.foot{text-align:center;margin-top:24px;font-size:12px;color:rgba(255,255,255,.35);animation:rise 1.3s .4s ease both}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="loader"></div></div>
<canvas id="particles"></canvas>
<div class="bg-glow a"></div>
<div class="bg-glow b"></div>
<div class="wrap">
<div class="brand">
<div class="logo">📡</div>
<h1>Sim Store</h1>
<p class="tag">منصتك الذكية والآمنة للأرقام الدائمة</p>
</div>
<div class="card">
<div class="stats">
<div class="stat"><div class="num" data-t="12000">0</div><div class="lbl">رقم نشط</div></div>
<div class="stat"><div class="num" data-t="8500">0</div><div class="lbl">عميل سعيد</div></div>
<div class="stat"><div class="num" data-t="99">0</div><div class="lbl">٪ نجاح</div></div>
</div>
<div class="features">
<div class="feat"><div class="ico">🔢</div><div class="txt">أرقام دائمة</div></div>
<div class="feat"><div class="ico">🛡️</div><div class="txt">حماية كاملة</div></div>
<div class="feat"><div class="ico">⚡</div><div class="txt">تسليم فوري</div></div>
<div class="feat"><div class="ico">🔄</div><div class="txt">تجديد سهل</div></div>
</div>
<a href="/login.html" class="btn">ابدأ الآن 🚀</a>
</div>
<p class="foot">© 2026 Sim Store — جميع الحقوق محفوظة</p>
</div>
<script>
window.addEventListener('load',()=>{setTimeout(()=>document.getElementById('splash').classList.add('hide'),900)});
document.querySelectorAll('.num').forEach(el=>{const t=+el.dataset.t;let c=0;const s=Math.max(1,Math.floor(t/60));const iv=setInterval(()=>{c+=s;if(c>=t){c=t;clearInterval(iv)}el.textContent=c.toLocaleString('en')},30)});
const cv=document.getElementById('particles'),cx=cv.getContext('2d');let w,h,ps=[];
function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<60;i++)ps.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*2+1});
function loop(){cx.clearRect(0,0,w,h);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle='rgba(167,139,250,.5)';cx.fill()});for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){cx.beginPath();cx.moveTo(ps[i].x,ps[i].y);cx.lineTo(ps[j].x,ps[j].y);cx.strokeStyle='rgba(102,126,234,'+(1-d/110)*.25+')';cx.stroke()}}requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
